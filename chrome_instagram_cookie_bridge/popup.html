<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 330px; margin: 0; padding: 16px; color: #e4e4e7; background: #09090b; font: 13px system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 16px; }
    p { color: #a1a1aa; line-height: 1.45; }
    button { box-sizing: border-box; width: 100%; margin-top: 8px; padding: 9px; border: 1px solid #3f3f46; border-radius: 6px; }
    button { border-color: #10b981; color: #052e16; background: #10b981; font-weight: 700; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .55; }
    #status { min-height: 38px; margin-top: 10px; color: #6ee7b7; white-space: pre-wrap; }
    #x-status { min-height: 38px; margin-top: 10px; color: #7dd3fc; white-space: pre-wrap; }
    .server-field { display: block; margin-top: 10px; color: #a1a1aa; font-size: 12px; }
    .server-field input { box-sizing: border-box; width: 100%; margin-top: 4px; padding: 8px; border: 1px solid #3f3f46; border-radius: 6px; background: #18181b; color: #e4e4e7; font: 13px system-ui, sans-serif; }
    .server-field input:focus { border-color: #10b981; outline: none; }
  </style>
</head>
<body>
  <h1>Media 쿠키 동기화</h1>
  <p>Chrome에 로그인된 쿠키를 Studio 서버 공용 저장소로 보냅니다.</p>
  <label class="server-field">서버 주소 (IP 또는 IP:포트)
    <input id="server" type="text" value="192.168.1.243" spellcheck="false" autocomplete="off">
  </label>
  <button id="sync">Instagram 쿠키 동기화</button>
  <div id="status"></div>
  <hr style="border:0;border-top:1px solid #27272a;margin:12px 0">
  <button id="sync-x">X/Twitter 쿠키 동기화</button>
  <div id="x-status"></div>
  <script src="popup.js"></script>
</body>
</html>
